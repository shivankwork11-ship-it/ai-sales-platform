<meta charset="utf-8">
<title>ANGAD funnel dashboard</title>
<style>
:root{
  /* warm white — paper, not screen. Warmed a further step (2026-08-08):
     the paper carries more amber, the ink is browner than black, and every
     categorical colour is desaturated toward earth so a long reading session
     stays soothing rather than shouting. */
  --bg:#f7f2ea; --panel:#fffaf3; --ink:#2b241d; --ink2:#54493d; --muted:#8a7b6b;
  --line:#e6dccc; --grid:#efe7db; --accent:#b4653d; --chip:#f2eadd;
  --c1:#b4653d; --c2:#4b7d70; --c3:#7d6f9f; --c4:#bf9a34; --c5:#5580a8;
  --c6:#ab5c6c; --good:#4b7d70; --warn:#bf8a3c; --bad:#b8514a;
}
/* Warm white is the product decision — we do not follow the OS into black.
   Dark mode only softens the paper, it never becomes a black screen. */

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14.5px/1.55 "Inter","Segoe UI Variable Text","Segoe UI",ui-sans-serif,system-ui,
    -apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;font-feature-settings:"tnum" 1,"cv05" 1}
/* ============ APP SHELL: left sidebar + main column (CRM layout) ============ */
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
.app.collapsed{grid-template-columns:52px 1fr}   /* sized to the icon, not to a hidden label */
#side{background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;padding:16px 14px;font-weight:700;
  letter-spacing:-.3px;border-bottom:1px solid var(--line)}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-style:normal;font-weight:800;flex:none;font-size:13px}
.app.collapsed .brand span,.app.collapsed nav button span.lbl{display:none}
/* COLLAPSED RAIL. The group headings used to display:none entirely, which took
   the dividers with them — 22 icons then floated in one undifferentiated
   column, left-aligned against a rail sized for icon+label. That is what looked
   broken. Collapsed, each heading becomes a hairline RULE instead of vanishing:
   the five chunks survive as visible groups even without their words, so the
   spatial memory built in the expanded view still works. Icons centre, the rail
   narrows to fit them, and every button keeps a title tooltip. */
.app.collapsed .navgroup{
  height:0;padding:0;margin:9px 8px;border-top:1px solid var(--line);
  overflow:hidden;opacity:1}
.app.collapsed .navgroup:first-child{display:none}
.app.collapsed #side nav{padding:6px 4px;gap:2px}
.app.collapsed #side nav button{justify-content:center;padding:10px 0;gap:0}
.app.collapsed #side nav button i{width:auto;font-size:15px}
.app.collapsed .brand{justify-content:center;padding:16px 6px}
#side nav{display:flex;flex-direction:column;gap:1px;padding:8px;border:0;margin:0}
#side nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;border-radius:8px;padding:9px 11px;color:var(--muted);
  font-weight:560;font-size:13.5px}
#side nav button:hover{background:var(--chip);color:var(--ink)}
#side nav button.on{background:var(--accent);color:#fff}
#side nav button i{font-style:normal;width:17px;text-align:center;flex:none;font-size:14px}
/* Group headings are the landmarks the grouped nav depends on. Gestalt common
   region: a visible boundary above each group makes the four chunks read as
   four objects rather than 22 items with occasional small text. */
.navgroup{font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);
  padding:14px 12px 5px;opacity:.85;border-top:1px solid var(--line);margin-top:8px}
.navgroup:first-child{border-top:0;margin-top:0;padding-top:6px}
.sidefoot{margin-top:auto;padding:10px;border-top:1px solid var(--line)}
.sidefoot button{width:100%;font-size:12px;border-radius:8px}
main{min-width:0;padding:0 0 80px}
.tbar{display:flex;align-items:center;gap:14px;padding:13px 22px 9px;flex-wrap:wrap}
.tbar h1{font-size:19px;margin:0;flex:none}
#idSearch{flex:1;max-width:400px;min-width:180px}
.toolbar{display:flex;align-items:center;gap:7px;padding:0 22px 8px;flex-wrap:wrap}
.toolbar .sep{width:1px;height:24px;background:var(--line);margin:0 3px}
.toolbar input[type=date]{padding:6px 9px;font-size:12.5px}
.dpreset{font-size:12px;padding:5px 12px;border-radius:18px}
.dpreset.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.mainpad{padding:0 22px}
@media(max-width:860px){.app{grid-template-columns:60px 1fr}
  .app .brand span,.app nav button span.lbl,.app .navgroup{display:none}}
h1{font-size:21px;margin:0;letter-spacing:-.3px}
h2{font-size:15px;margin:26px 0 10px;letter-spacing:-.1px}
h3{font-size:12px;margin:0 0 10px;color:var(--muted);font-weight:650;
  text-transform:uppercase;letter-spacing:.5px}
.sub{color:var(--muted);font-size:12.5px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.badge{font-size:11px;background:var(--chip);color:var(--muted);border-radius:20px;
  padding:4px 11px;border:1px solid var(--line)}
button,select,input{font:inherit;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:7px;padding:7px 10px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px;margin:16px 0}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:11px}
.f label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;
  text-transform:uppercase;letter-spacing:.4px}
.f input[type=date],.f input[type=text]{width:100%}
.ms{position:relative}
.ms-btn{width:100%;text-align:left;display:flex;justify-content:space-between;
  align-items:center;gap:8px;min-height:36px}
.ms-btn .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-btn .cnt{background:var(--accent);color:#fff;border-radius:11px;padding:1px 8px;
  font-size:11px;font-weight:650;flex:none}
.ms-btn.active{border-color:var(--accent)}
.ms-pop{display:none;position:absolute;z-index:40;top:calc(100% + 4px);left:0;
  min-width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;box-shadow:0 10px 32px rgba(0,0,0,.22);padding:8px}
.ms-pop.open{display:block}
.ms-search{width:100%;margin-bottom:6px}
.ms-list{max-height:230px;overflow:auto}
.ms-opt{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;
  cursor:pointer;font-size:13px;white-space:nowrap}
.ms-opt:hover{background:var(--chip)}
.ms-opt input{margin:0;accent-color:var(--accent)}
.ms-acts{display:flex;gap:6px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.ms-acts button{flex:1;padding:5px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:20px;
  padding:3px 6px 3px 11px;font-size:12px;display:flex;align-items:center;gap:6px}
.chip b{font-weight:500;color:var(--muted)}
.chip span{cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 3px}
.chip span:hover{color:var(--ink)}
.fbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.cov{font-size:11.5px;color:var(--muted);margin-top:7px}
.cockcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:16px 18px;cursor:pointer;transition:border-color .12s, transform .12s}
.ccard:hover{border-color:var(--accent);transform:translateY(-1px)}
.ccard .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.ccard .v{font-size:30px;font-weight:680;letter-spacing:-.8px;margin-top:5px}
.ccard .d{font-size:11.5px;color:var(--muted)}
.ccard.good{border-left:4px solid #008300}
.ccard.bad{border-left:4px solid #e34948}
.callcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:15px;margin:10px 0}
.callcard audio{width:100%;margin:8px 0}
.tsplit{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.tsplit{grid-template-columns:1fr}}
.tpane{background:var(--chip);border-radius:8px;padding:10px 12px;font-size:12.5px;
  max-height:220px;overflow:auto;white-space:pre-wrap;color:var(--ink2)}
.tpane b{display:block;margin-bottom:5px;color:var(--muted);font-size:10.5px;
  text-transform:uppercase;letter-spacing:.5px}
.digestbox{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:1000px){.digestbox{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--panel);border-radius:10px;padding:12px 14px;height:124px;overflow:hidden;
  display:grid;grid-template-rows:28px 32px 1fr;align-content:start}
.kpi .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;align-self:start}
.kpi .v{font-size:25px;font-weight:660;margin:0;letter-spacing:-.7px;line-height:32px;
  align-self:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:10.5px;color:var(--muted);line-height:1.32;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;align-self:start}
nav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:18px;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 15px;
  font-weight:560;color:var(--muted);border-radius:0}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
section{display:none;padding-top:4px} section.on{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;margin-bottom:4px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;align-items:start;margin-bottom:4px}
@media(max-width:1050px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--panel);border-radius:10px;padding:16px 18px;margin:0 0 16px}
#s-review .card{margin-bottom:20px}
#s-review .card h3{margin:0 0 10px}
#s-review .card>div{margin-bottom:8px}
#s-review .tblwrap{margin-top:10px}
#s-review h2{margin:30px 0 12px}
/* ---- containment pass (2026-08-08) ----
   The classic cause of "the UI is wrong in many places": a flex/grid child
   defaults to min-width:auto, so ONE wide table or chart inside a card pushes
   the whole column wider than the viewport and every section inherits a
   horizontal scrollbar. Pin the column, let the scroll happen INSIDE the
   element that is actually too wide, never on the page.
   NOTE: written from the structural cause, NOT verified visually — the
   browser pane would not composite when this was applied. Re-check on screen. */
.mainpad,main,section{min-width:0;max-width:100%}
section>*{max-width:100%}
.card,.kpi,.istat,.band{min-width:0;overflow:hidden}
.card svg,.istat svg{max-width:100%;height:auto}
.tblwrap{max-width:100%}
/* a table that escaped its wrapper scrolls itself rather than the page */
section>table,.card>table{display:block;overflow-x:auto;max-width:100%}
body{overflow-x:hidden}

/* ---- ONE SIZE SYSTEM (2026-08-08 cognitive-load pass) ----
   77 charts existed at 6+ different heights. Inconsistent sizing is read as
   MEANING — a bigger chart looks more important — so arbitrary variation makes
   the eye rank things the data never ranked. Three sizes only, and a chart may
   never exceed the card that holds it.
     · default  260px  — the ordinary case
     · .chart-s 180px  — supporting detail
     · .chart-l 340px  — the one chart a section is actually about
   Cards in a grid share a row height so the eye can scan across them without
   re-anchoring on every card (saccade cost, not aesthetics). */
.card svg{max-width:100%;height:auto;display:block}
.card>svg,.card .chartbox svg{max-height:260px}
.chart-s svg{max-height:180px}
.chart-l svg{max-height:340px}
.grid2>.card,.grid3>.card{display:flex;flex-direction:column}
.grid2>.card>svg,.grid3>.card>svg{margin-top:auto}
/* headings: one rhythm everywhere, so a section's structure is learnable */
section h2{font-size:16px;margin:26px 0 10px;letter-spacing:-.01em}
section h2:first-child{margin-top:4px}
section h3{font-size:13.5px;margin:14px 0 8px;color:var(--ink2)}

/* Still-pending cards: severity is carried on the left edge, the one place the
   contract permits emphasis, so the eye lands on the blocking rows first. */
#s-pending .card{border-left:3px solid var(--line)}
#s-pending .card.pend-bad{border-left-color:var(--bad)}
#s-pending .card.pend-warn{border-left-color:var(--warn)}
.pendhead{display:flex;align-items:baseline;gap:12px;margin-bottom:2px}
.pendarea{font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted)}
.pendn{margin-left:auto;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
#s-pending .card h3{margin:2px 0 6px}
#s-pending .card button{margin-top:10px;background:var(--chip);border:1px solid var(--line);
  border-radius:8px;padding:7px 12px;font:inherit;font-size:12.5px;color:var(--ink2)}
#s-pending .card button:hover{border-color:var(--accent);color:var(--ink)}

/* progressive disclosure on heavy sections */
.folded{display:none}
.folded.open{display:block}
button.discl{background:var(--chip);border:1px solid var(--line);border-radius:9px;
  padding:10px 15px;color:var(--ink2);font:inherit;font-size:13px;font-weight:560;
  margin:6px 0 22px;width:100%;text-align:left}
button.discl:hover{border-color:var(--accent);color:var(--ink)}

/* filter options carry their live count; dead-in-window options are marked */
.ms-opt{display:flex;align-items:center;gap:8px}
.ms-opt .optn{margin-left:auto;font-size:11px;color:var(--muted);
  background:var(--chip);border-radius:9px;padding:1px 7px;flex:none}
.ms-opt.dead{opacity:.45}
.ms-opt.dead .optn{color:var(--bad)}

/* Leads board (RAMA-7): the board's own filter row */
#lbTools{flex-wrap:wrap;gap:8px;margin-bottom:12px}
#lbTools select{background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:6px 9px;font:inherit;font-size:12.5px;max-width:210px}
#lbTools select:hover{border-color:var(--accent)}
#s-leadsboard .tblwrap{max-height:620px}
#s-leadsboard .kpis{margin-bottom:14px}

/* Daily Report: count cells are links to their constituents */
#s-daily .tblwrap{max-height:none}
#s-daily td.cell{cursor:pointer;color:var(--accent,#2a78d6);font-weight:600}
#s-daily td.cell:hover{background:rgba(42,120,214,.10);text-decoration:underline}
#s-daily tfoot td{position:sticky;bottom:0;background:var(--panel);
  border-top:2px solid var(--line);font-weight:700}
#s-daily thead th{position:sticky;top:0;background:var(--panel);z-index:2}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:var(--ink2)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px}
.tblwrap{overflow:auto;max-height:440px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--panel);text-align:left;padding:9px 11px;
  border-bottom:1px solid var(--line);color:var(--muted);font-weight:640;
  white-space:nowrap;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;z-index:1}
td{padding:8px 11px;border-bottom:1px solid var(--grid);color:var(--ink2);
  max-width:430px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:hover td{background:var(--grid)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:9px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
/* Captions had NO margin and no line-height: the trailing caption under a
   table sat flush against its bottom border and ran the full column width as
   one dense line. That is the "text at the bottom looks wrong" the user
   reported on the Daily Report. Give it air, a readable measure, and real
   leading — and space it away from whatever it is explaining. */
.cap{font-size:12px;color:var(--muted);line-height:1.6;max-width:92ch;
  margin:10px 0 0}
.tblwrap+.cap,table+.cap,.kpis+.cap{margin-top:12px}
.cap+.cap{margin-top:4px}
/* the last thing in a section must not touch the viewport edge */
section>*:last-child{margin-bottom:28px}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:7px;padding:11px 13px;color:var(--ink2);font-size:12.5px;margin:12px 0}
.note b{color:var(--ink)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);
  padding:6px 9px;border-radius:5px;font-size:12px;opacity:0;transition:opacity .1s;
  z-index:99;white-space:nowrap}
svg text{font:12.5px ui-sans-serif,system-ui,sans-serif;fill:var(--muted)}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;
  align-items:center;justify-content:center;z-index:50}
#busy>div{background:var(--panel);padding:22px 28px;border-radius:10px;
  border:1px solid var(--line);max-width:640px}
pre{white-space:pre-wrap;font-size:11.5px;color:var(--muted);max-height:240px;overflow:auto}
/* ---- VAMANA UX layer: borderless depth, hierarchy, one click contract ---- */
.card,.kpi,.ccard,.callcard,.filters,.tblwrap,.note{border:none;box-shadow:0 1px 2px rgba(15,20,30,.06),0 4px 14px rgba(15,20,30,.05)}
@media (prefers-color-scheme:dark){.card,.kpi,.ccard,.callcard,.filters,.tblwrap,.note{box-shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3)}}
/* SALIENCE IS RELATIVE. There are 52 .note boxes across the app and every one
   of them carried a 3px accent bar, so the bar carried no information — when
   everything is marked important, the marker is noise and the eye learns to
   skip all of them, including the one that mattered. Explanatory notes now sit
   quiet (they are read when sought, not shouted); only .note.warn keeps the
   accent, matching the contract rule that reserves emphasis for real failure. */
.note{border-left:3px solid var(--line);color:var(--ink2)}
.note.warn{border-left:3px solid var(--accent);color:var(--ink)}
.note.bad{border-left:3px solid var(--bad);color:var(--ink)}
.card svg,.tsplit svg{max-width:100%;display:block;height:auto}
.kpis .kpi:first-child .v{font-size:34px}
.kpi{cursor:default}
.kpis>.kpi{height:124px}
.idlink{cursor:pointer;text-decoration:underline dotted;color:var(--accent)}
.scopes{display:flex;gap:6px;flex-wrap:wrap;padding:0 22px 8px;margin:0}
.scopes button{font-size:12px;padding:4px 12px;border-radius:20px}
.scopes button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.fixedwin{font-size:10.5px;background:var(--chip);color:var(--muted);border-radius:12px;
  padding:2px 9px;margin-left:8px;vertical-align:middle;letter-spacing:.3px}
/* insight cards — red is reserved for systemic failure only */
.insight{background:var(--panel);border-radius:10px;padding:14px 16px;margin:10px 0;
  box-shadow:0 1px 2px rgba(15,20,30,.06),0 4px 14px rgba(15,20,30,.05);cursor:pointer}
.insight:hover{transform:translateY(-1px)}
.insight .role{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.insight .t{font-weight:650;margin:3px 0}
.insight.fail{border-left:4px solid #e34948}
.insight.warn{border-left:4px solid #d99114}
.insight.info{border-left:4px solid var(--line)}
/* band cards */
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.band{background:var(--panel);border-radius:11px;padding:16px 18px;cursor:pointer;
  box-shadow:0 1px 2px rgba(15,20,30,.06),0 4px 14px rgba(15,20,30,.05)}
.band .n{font-size:32px;font-weight:700;letter-spacing:-.8px}
.band .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.band.on{outline:2px solid var(--accent)}
/* lead modal */
#lmOverlay{position:fixed;inset:0;background:rgba(10,12,16,.45);display:none;
  align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:4vh 12px}
#lmOverlay.open{display:flex}
#lmBox{background:var(--bg);border-radius:14px;max-width:1080px;width:100%;
  box-shadow:0 20px 70px rgba(0,0,0,.4);padding:22px 26px;margin-bottom:6vh}
#lmTabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--chip);border-radius:10px;padding:5px;margin:14px 0}
#lmTabs button{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:560;color:var(--muted)}
#lmTabs button.on{background:var(--accent);color:#fff}

<script>
const TOKEN = "__TOKEN__";
const tip = document.getElementById('tip');
let D = null, OPT = null, loadSeq = 0;

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => typeof v==='number' ? (Number.isInteger(v)?v.toLocaleString():v.toFixed(2)) : esc(v);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};

function hover(node, html){
  node.addEventListener('mousemove', e=>{
    tip.innerHTML=html; tip.style.opacity=1;
    tip.style.left=Math.min(e.clientX+12, innerWidth-tip.offsetWidth-8)+'px';
    tip.style.top=(e.clientY-34)+'px';
  });
  node.addEventListener('mouseleave', ()=> tip.style.opacity=0);
}

/* ---------------- charts ---------------- */
const NS='http://www.w3.org/2000/svg';
const mk=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

const PALETTE=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
function hbar(data,{unit='',color=null,dim=null,probe=null}={}){
  if(!data||!data.length) return el('div','cap','No data for this selection.');
  // SIZE DISCIPLINE. Height was purely data.length*26, which produced 21
  // distinct chart heights across the app from 62px to 426px. Inconsistent
  // size is read as importance — a taller chart looks like it matters more —
  // so arbitrary variation makes the eye rank things the data never ranked.
  // Cap rows at 12 (the tail is noise in a ranked bar chart and the drill-down
  // has the full list) and floor the height so a 2-row chart still reads as a
  // chart rather than a stray label.
  const TRIM=data.length>12;
  if(TRIM){ data=data.slice(0,12); }
  const rowH=26,pad=5,labelW=178,max=Math.max(1,...data.map(d=>d.value));
  const h=Math.max(110,data.length*rowH+pad*2);
  const svg=mk('svg',{viewBox:`0 0 740 ${h}`,width:'100%',height:h});
  data.forEach((d,i)=>{
    const y=pad+i*rowH;
    const t=mk('text',{x:labelW-8,y:y+15,'text-anchor':'end'});
    t.textContent=d.label.length>26?d.label.slice(0,25)+'…':d.label;
    hover(t,esc(d.label)); svg.appendChild(t);
    const w=Math.max(2,(740-labelW-80)*d.value/max);
    const r=mk('rect',{x:labelW,y:y+4,width:w,height:17,rx:4,
      fill:d.color||color||PALETTE[i%PALETTE.length]});
    hover(r,`<b>${esc(d.label)}</b><br>${d.value.toLocaleString()}${unit}`+(d.pct!=null?` · ${d.pct}%`:'')+
      (probe?'<br><i>click to investigate these rows</i>':dim?'<br><i>click to filter by this</i>':''));
    if(probe){                     // UNIVERSAL PROBE: open the story behind the bar
      r.style.cursor='pointer';
      r.addEventListener('click',()=>openSlice(probe,d.label,d.value));
    } else if(dim){                // click-to-filter: any bar on a filterable
      r.style.cursor='pointer';    // dimension applies itself as a filter
      r.addEventListener('click',()=>{
        if(!SEL[dim]) SEL[dim]=new Set();
        SEL[dim].clear(); SEL[dim].add(String(d.label));
        buildFilters(); load();
      });
    }
    svg.appendChild(r);
    const v=mk('text',{x:labelW+w+7,y:y+16,fill:'var(--ink2)'});
    v.textContent=d.value.toLocaleString()+(d.pct!=null?` (${d.pct}%)`:'');
    svg.appendChild(v);
  });
  // never truncate silently — a chart that hides rows without saying so is a
  // chart that lies about its own completeness
  if(TRIM){
    const box=el('div'); box.appendChild(svg);
    box.appendChild(el('div','cap','Top 12 shown — click any bar for the full list behind it.'));
    return box;
  }
  return svg;
}

function vstack(labels,series,{h=250,unit=''}={}){
  if(!labels||!labels.length) return el('div','cap','No data.');
  const padL=54,padB=28,padT=8,w=1000,ih=h-padB-padT,iw=w-padL-12;
  const totals=labels.map((_,i)=>series.reduce((s,x)=>s+(x.values[i]||0),0));
  const max=Math.max(1,...totals);
  const svg=mk('svg',{viewBox:`0 0 ${w} ${h}`,width:'100%',height:h});
  for(let g=0;g<=4;g++){
    const y=padT+ih-ih*g/4;
    svg.appendChild(mk('line',{x1:padL,x2:w-12,y1:y,y2:y,stroke:'var(--grid)','stroke-width':1}));
    const t=mk('text',{x:padL-8,y:y+4,'text-anchor':'end'});
    t.textContent=Math.round(max*g/4).toLocaleString(); svg.appendChild(t);
  }
  const bw=Math.max(2,iw/labels.length-2);
  labels.forEach((lb,i)=>{
    const x=padL+iw*i/labels.length; let acc=0;
    series.forEach(s=>{
      const v=s.values[i]||0; if(!v) return;
      const bh=ih*v/max, y=padT+ih-bh-acc;
      const r=mk('rect',{x,y,width:bw,height:Math.max(1,bh-2),rx:2,fill:s.color,
        stroke:'var(--panel)','stroke-width':2});
      hover(r,`<b>${esc(lb)}</b><br>${esc(s.name)}: ${v.toLocaleString()}${unit}<br>total ${totals[i].toLocaleString()}`);
      svg.appendChild(r); acc+=bh;
    });
    const step=Math.max(1,Math.ceil(labels.length/14));
    if(i%step===0){
      const t=mk('text',{x:x+bw/2,y:h-9,'text-anchor':'middle'});
      t.textContent=lb.length>9?lb.slice(5):lb; svg.appendChild(t);
    }
  });
  return svg;
}

/* line chart — for rates/trends where a stacked bar misleads */
function vline(labels, series, {h=240, unit='', ymax=null}={}){
  if(!labels||!labels.length) return el('div','cap','No data.');
  const padL=54,padB=28,padT=10,w=1000,ih=h-padB-padT,iw=w-padL-14;
  const max=ymax||Math.max(1,...series.flatMap(s=>s.values.filter(v=>v!=null)));
  const svg=mk('svg',{viewBox:`0 0 ${w} ${h}`,width:'100%',height:h});
  for(let g=0;g<=4;g++){
    const y=padT+ih-ih*g/4;
    svg.appendChild(mk('line',{x1:padL,x2:w-14,y1:y,y2:y,stroke:'var(--grid)','stroke-width':1}));
    const t=mk('text',{x:padL-8,y:y+4,'text-anchor':'end'});
    t.textContent=Math.round(max*g/4).toLocaleString()+unit; svg.appendChild(t);
  }
  const X=i=>padL+(labels.length===1?iw/2:iw*i/(labels.length-1));
  const Y=v=>padT+ih-ih*Math.min(v,max)/max;
  series.forEach(s=>{
    const pts=s.values.map((v,i)=>v==null?null:[X(i),Y(v)]);
    let d='', pen=false;
    pts.forEach(pt=>{ if(!pt){pen=false;return;} d+=(pen?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1); pen=true; });
    svg.appendChild(mk('path',{d,fill:'none',stroke:s.color,'stroke-width':2,
      'stroke-linejoin':'round','stroke-linecap':'round'}));
    pts.forEach((pt,i)=>{
      if(!pt) return;
      const dot=mk('circle',{cx:pt[0],cy:pt[1],r:labels.length>40?2.5:4,fill:s.color,
        stroke:'var(--panel)','stroke-width':2});
      hover(dot,`<b>${esc(labels[i])}</b><br>${esc(s.name)}: ${s.values[i]}${unit}`);
      svg.appendChild(dot);
    });
  });
  labels.forEach((lb,i)=>{
    const step=Math.max(1,Math.ceil(labels.length/14));
    if(i%step===0){const t=mk('text',{x:X(i),y:h-9,'text-anchor':'middle'});
      t.textContent=String(lb).length>9?String(lb).slice(5):lb; svg.appendChild(t);}
  });
  return svg;
}

function heatmap(H){
  const box=el('div');
  const tbl=el('table'); tbl.style.fontSize='10.5px';
  let html='<thead><tr><th></th>'+H.hours.map(h=>`<th style="padding:3px 4px;text-align:center">${h}</th>`).join('')+'</tr></thead><tbody>';
  H.weekdays.forEach((w,i)=>{
    html+=`<tr><th style="padding:3px 6px">${w.slice(0,3)}</th>`;
    H.hours.forEach((_,j)=>{
      const r=H.rate[i][j], n=H.dials[i][j];
      let bg='transparent', fg='var(--muted)';
      if(r!=null&&n>=20){
        const t=Math.min(r,25)/25;            // 0..25% connect maps to ramp
        bg=`rgba(42,120,214,${0.08+0.72*t})`; // one-hue sequential ramp
        fg=t>0.55?'#fff':'var(--ink2)';
      } else if(n>0){ bg='var(--grid)'; }
      html+=`<td style="padding:3px 2px;text-align:center;background:${bg};color:${fg}" `+
            `title="${w} ${H.hours[j]}:00 — ${n.toLocaleString()} dials, ${r==null?'n/a':r+'% connect'}">`+
            `${r!=null&&n>=20?Math.round(r):''}</td>`;
    });
    html+='</tr>';
  });
  tbl.innerHTML=html+'</tbody>';
  const wrap=el('div'); wrap.style.overflow='auto'; wrap.appendChild(tbl);
  box.appendChild(wrap);
  box.appendChild(el('div','cap','Cell = connect % (IST). Blank cells have under 20 dials. '+
    'Darker = better. Hover for exact numbers.'));
  return box;
}

function legend(series){
  return el('div','legend', series.map(s=>
    `<span><i style="background:${s.color}"></i>${esc(s.name||s.label)}</span>`).join(''));
}

function tableEl(t){
  const box=el('div');
  if(!t||!t.rows||!t.rows.length){ box.appendChild(el('div','cap','No rows for this selection.')); return box; }
  const tools=el('div','tools');
  const inp=el('input'); inp.placeholder='Filter these rows…'; inp.style.minWidth='240px';
  inp.oninput=()=>{const q=inp.value.toLowerCase();
    wrap.querySelectorAll('tbody tr').forEach(tr=>{
      tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none';});};
  tools.appendChild(inp);
  const dl=el('button',null,'Download CSV');
  dl.onclick=()=>{
    // contract rule 12: exports carry the filter state in the filename and a
    // header row stating the scope used
    const q=currentQuery();
    const chips=Object.entries(q).filter(([k])=>!['t','from','to'].includes(k))
      .map(([k,v])=>k+'='+String(v).split('|').join('+')).join('_').slice(0,80);
    const fname=['angad',q.from||'all',q.to||'now',chips].filter(Boolean).join('_')
      .replace(/[^A-Za-z0-9_+=.-]/g,'')+'.csv';
    const header='# ANGAD export · window '+(q.from||'(open)')+' → '+(q.to||'(open)')+
      ' · filters: '+(chips||'none')+' · rows shown '+t.shown+' of '+t.total+
      ' · generated '+new Date().toISOString().slice(0,16);
    const rows=[header,t.cols.join(',')].concat(t.rows.map(r=>r.map(v=>{
      const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
    }).join(',')));
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
    a.download=fname; a.click();
  };
  tools.appendChild(dl);
  tools.appendChild(el('span','cap',`${t.shown.toLocaleString()} of ${t.total.toLocaleString()} rows`));
  box.appendChild(tools);
  const wrap=el('div','tblwrap');
  // identity columns are links: click a lead_id / MLID / lead_ref anywhere
  // and its full profile opens on the MLID Profile tab
  const idCols=t.cols.map((c,i)=>['MLID','Lead ID','Source Lead ID','lead_ref','lead_id','mlid','masterleadid','source_lead_id'].includes(c)?i:-1).filter(i=>i>=0);
  wrap.innerHTML='<table><thead><tr>'+t.cols.map(c=>`<th>${esc(c)}</th>`).join('')+
    '</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map((v,i)=>
      `<td class="${typeof v==='number'?'num':''}${idCols.includes(i)&&v!=null&&v!==''?' idlink':''}" title="${esc(v)}">${num(v)}</td>`
    ).join('')+'</tr>').join('')+'</tbody></table>';
  if(idCols.length) wrap.querySelectorAll('td.idlink').forEach(td=>{
    td.title='Open this lead (modal)';
    td.onclick=()=>openLeadModal(td.textContent.trim());
  });
  box.appendChild(wrap);
  return box;
}

/* jump to the MLID Profile tab and load an id */
function openProfile(id){
  document.querySelectorAll('nav button').forEach(b=>{ if(b.textContent==='MLID Profile') b.click(); });
  const inp=document.getElementById('profQ');
  if(inp){ inp.value=id; loadProfile(id); }
}

function slotCard(title,slot,color){
  const d=el('div','card');
  d.appendChild(el('h3',null,esc(title)));
  if(!slot||!slot.data||!slot.data.length){
    d.appendChild(el('div','cap','Not captured on any call in this selection.'));
    return d;
  }
  d.appendChild(hbar(slot.data,{color:color}));
  d.appendChild(el('div','cov','Captured on <b>'+slot.filled.toLocaleString()+
    '</b> of '+slot.of.toLocaleString()+' transcribed calls ('+slot.pct+
    '%). The rest left this field blank \u2014 the bars are that subset, not the whole selection.'));
  return d;
}

function card(title,node,caption){
  const d=el('div','card');
  if(title) d.appendChild(el('h3',null,esc(title)));
  if(node) d.appendChild(node);
  if(caption) d.appendChild(el('div','cap',caption));
  return d;
}
function renderVisits(s, V){
  s.appendChild(el('h2',null,'Site visits'));
  if(V.note) s.appendChild(el('div','note',V.note));
  if(V.kpis) s.appendChild(kpiRow(V.kpis));
  (V.charts||[]).forEach(pair=>{
    if(pair.length===2) s.appendChild(grid(2, card(pair[0].title,hbar(pair[0].data)),
                                              card(pair[1].title,hbar(pair[1].data))));
    else s.appendChild(card(pair[0].title,hbar(pair[0].data)));
  });
  if(V.funnel) s.appendChild(card('Visit funnel', hbar(V.funnel)));
  if(V.table){ s.appendChild(el('h2',null,'Every visit on record')); s.appendChild(tableEl(V.table)); }
  if(V.gap) { const n=el('div','note',esc(V.gap)); n.style.borderLeftColor='#e34948'; s.appendChild(n); }
}

/* metrics with a real /api/drill branch — kept in sync with build_drill() */
const DRILLABLE=new Set(['Calls triggered','Dial attempts','Unique numbers',
  'Unique humans','Humans dialled','Connected','Humans connected','Booked',
  'Humans booked (call outcome)','Dropped','Qualified',
  'Humans in real conversation','Humans DNC','Median talk time','₹ spend (approx)']);

/* KPI row under the design contract: every number is a link (rule 1),
   every number can explain itself (rule 5), data-quality badges inline
   (rule 6), previous-period delta as a toggle (rule 8). */
function kpiRow(list){
  const box=el('div','kpis');
  list.filter(Boolean).forEach(k=>{
    // CONTRACT AT RENDER TIME. The server walks its own payload, but several
    // sections (Daily Report, Leads board, QA, Builder, Attendance) are built
    // by their own endpoints and never pass through it — 45 visible cards had
    // no contract for that reason. Registering here means a card cannot reach
    // the screen without being able to answer "what do you count?", whichever
    // endpoint produced it.
    if(D&&k.label){
      D.card_contracts=D.card_contracts||{};
      if(!D.card_contracts[k.label]&&!(D.lineage&&D.lineage[k.label])){
        D.card_contracts[k.label]={
          contract:'PARTIAL',
          def:(k.sub||'').trim()||'No written definition yet — this card states a '+
              'value and its source, but its constituents have not been contracted.',
          num:null,den:null,
          window:'current date filter',filters:'all active filters',
          src:k.src||'not stated on the card',
          excl:'PARTIAL contract: derived from the card’s own sub-label and '+
               'source at render time, NOT verified against a query. Treat the '+
               'number as directional until it is.'};
      }
    }
    const d=el('div','kpi'+(k.drill?' drillable':''));
    let deltaHtml='';
    if(D&&D.prev&&window.CMP_ON){
      const map={'Calls triggered':'dials','Connected':'connected','Booked':'booked',
                 'Dial attempts':'dials'};
      const pk=map[k.label];
      if(pk!=null&&D.prev[pk]!=null){
        const cur=parseInt(String(k.value).replace(/[^0-9]/g,''))||0;
        const dl=cur-D.prev[pk];
        deltaHtml=`<div class="s" style="color:${dl>=0?'#0a8a0a':'#e34948'}">`+
          `${dl>=0?'▲':'▼'} ${Math.abs(dl).toLocaleString()} vs prev period</div>`;
      }
    }
    d.innerHTML=`<div class="l">${esc(k.label)}
        <span class="expl" title="Explain this number">ⓘ</span></div>
      <div class="v">${esc(k.value)}</div>
      ${k.sub?`<div class="s">${esc(k.sub)}</div>`:''}${deltaHtml}
      ${k.dq?`<div class="s dqbadge" title="${esc(k.dq.why)}">⚠ ${k.dq.n.toLocaleString()} flagged rows</div>`:''}
      ${k.src?`<div class="s" style="opacity:.55">${esc(k.src)}</div>`:''}`;
    // only advertise a drill where one actually exists — a card that promises
    // a pop-box and returns an error is worse than a card that stays quiet
    if(DRILLABLE.has(k.label)){
      d.classList.add('drillable');
      d.onclick=e=>{ if(e.target.classList.contains('expl'))return; openDrill(k.label,k.value); };
      d.title='Click: the exact rows behind this number (pop-box) · ⓘ: definition';
    } else if(k.drill){
      d.classList.add('drillable');
      d.onclick=e=>{ if(e.target.classList.contains('expl'))return; gotoTab(k.drill); };
      d.title='Click: open the section behind this number · ⓘ: definition';
    } else {
      d.title='ⓘ: what this number means';
    }
    d.querySelector('.expl').onclick=e=>{ e.stopPropagation(); explain(k.label); };
    box.appendChild(d);
  });
  return box;
}

/* Drill pop-box (contract rules 1+2): click a number → the rows behind it,
   with aggregate-vs-rows parity shown on the box itself. */
async function openDrill(label,value){
  const ov=document.getElementById('lmOverlay'); ov.classList.add('open');
  document.getElementById('lmTitle').textContent=label+' — '+value;
  document.getElementById('lmSub').textContent='loading the exact rows behind this number…';
  ['lmHead','lmTabs','lmBody'].forEach(x=>document.getElementById(x).innerHTML='');
  const q=currentQuery(); q.metric=label;
  let R;
  try{ R=await (await fetch('/api/drill?'+new URLSearchParams(q))).json(); }
  catch(e){ document.getElementById('lmSub').textContent='server unreachable'; return; }
  const body=document.getElementById('lmBody');
  if(R.error){
    document.getElementById('lmSub').textContent='';
    body.innerHTML='<div class="nacard">'+esc(R.error)+'</div>';
    if(D.lineage&&D.lineage[label]) explain(label);
    return;
  }
  // Parity is only meaningful for COUNT metrics. A median or a sum is a
  // statistic over the rows, not a row count — claiming a mismatch there
  // would be a lie (audit findings #10, #11).
  const vDigits=String(value).replace(/[^0-9]/g,'');
  const isPlaceholder=/^(—|-|NA|N\/A)$/i.test(String(value).trim());
  const isCount=(R.count_kind!=='measure') && !isPlaceholder && vDigits!=='';
  const parity=isCount && vDigits===String(R.count).replace(/[^0-9]/g,'');
  document.getElementById('lmSub').innerHTML=
    'window '+esc(R.window)+' · card shows <b>'+esc(value)+'</b> · drill returns <b>'+
    esc(R.count)+'</b> over '+R.rows_total.toLocaleString()+' rows — '+
    (!isCount
      ? '<span style="opacity:.65">'+(isPlaceholder
          ? 'no rows qualify under these filters; the rows below are the population behind the metric'
          : 'a statistic, not a count — the rows below are the population it is computed over')+'</span>'
      : parity
        ? '<span style="color:#0a8a0a">MATCH ✓ (one metric, one query)</span>'
        : '<span style="color:#e34948">MISMATCH — build-breaking bug, please report via Feedback</span>');
  if(R.lineage) body.appendChild(el('div','note','<b>Definition:</b> '+esc(R.lineage.def)+
    ' <span class="cap">· source: '+esc(R.lineage.src)+'</span>'));
  body.appendChild(tableEl(R.tbl));
  body.appendChild(el('div','cap','Click any id to open that lead · Download CSV carries this filter state.'));
}

/* UNIVERSAL PROBE — click any bar and get the whole story behind those rows:
   who they were, what they talked about, whether they got frustrated, whether
   WhatsApp went out, and why they were called so many times. */
async function openSlice(dim,label,value){
  const ov=document.getElementById('lmOverlay'); ov.classList.add('open');
  document.getElementById('lmTitle').textContent=label+' — '+Number(value).toLocaleString()+' rows';
  document.getElementById('lmSub').textContent='investigating…';
  ['lmHead','lmTabs','lmBody'].forEach(x=>document.getElementById(x).innerHTML='');
  const q=currentQuery(); q.dim=dim;
  q.value=(dim==='attempts'||dim==='hour') ? String(label).replace(/[^0-9.]/g,'') : label;
  let S;
  try{ S=await (await fetch('/api/slice?'+new URLSearchParams(q))).json(); }
  catch(e){ document.getElementById('lmSub').textContent='server unreachable'; return; }
  const body=document.getElementById('lmBody');
  if(S.error){ document.getElementById('lmSub').textContent='';
    body.innerHTML='<div class="nacard">'+esc(S.error)+'</div>'; return; }
  document.getElementById('lmSub').textContent=
    dim+' = '+S.value+' · window '+S.window+' · '+S.calls.toLocaleString()+
    ' calls across '+S.leads.toLocaleString()+' leads';
  document.getElementById('lmHead').appendChild(kpiRow(S.facts));
  const tabs=[
    ['Why these rows',()=>{const d=el('div');
      d.appendChild(el('div','note',esc(S.note)));
      const g=el('div','grid2');
      g.appendChild(card('Outcomes in this slice',hbar(S.outcome_mix),'angad.calls.outcome'));
      g.appendChild(card('Dial status',hbar(S.status_mix),'angad.calls.status'));
      d.appendChild(g);
      if(S.drop_mix&&S.drop_mix.length)
        d.appendChild(card('Where they dropped',hbar(S.drop_mix),'angad.calls.drop_stage'));
      return d;}],
    ['What they talked about',()=>{
      if(!S.talked_about) return el('div','nacard',
        'No intent rows for these calls — the intelligence collection covers only part of the corpus. NA, not zero.');
      const t=S.talked_about,d=el('div');
      d.appendChild(el('div','note','Scored on <b>'+t.n.toLocaleString()+
        '</b> of these calls · source: '+esc(t.src)));
      const g=el('div','grid2');
      if(t.caller_intent.length) g.appendChild(card('Caller intent',hbar(t.caller_intent)));
      if(t.sentiment.length) g.appendChild(card('Customer sentiment (frustration signal)',
        hbar(t.sentiment),'negative / very_negative = frustrated'));
      d.appendChild(g);
      if(t.objections.length) d.appendChild(card('Objections raised',hbar(t.objections)));
      if(t.summaries.length){
        d.appendChild(el('h3',null,'What actually happened on these calls'));
        t.summaries.forEach(x=>d.appendChild(el('div','cap','• '+esc(x))));
      }
      return d;}],
    ['The leads',()=>{const d=el('div');
      d.appendChild(tableEl(S.leads_tbl));
      d.appendChild(el('div','cap','Click any MLID to open the lead → its Conversation tab shows the turn-by-turn transcript.'));
      return d;}],
    ['Every call',()=>tableEl(S.calls_tbl)],
  ];
  const tb=document.getElementById('lmTabs');
  tabs.forEach(([n,fn],i)=>{
    const b=el('button',null,esc(n)); if(!i) b.classList.add('on');
    b.onclick=()=>{ tb.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); body.innerHTML=''; body.appendChild(fn()); };
    tb.appendChild(b);
  });
  body.innerHTML=''; body.appendChild(tabs[0][1]());
}

/* ============ DAILY REPORT (RAMA-3) ============
   The Growth-Reports table: Date · Week · Project × stage. Every count cell is
   a link to the exact lead rows behind it (Total Count · search · Download),
   which is their interaction, not one we invented. */
let RPT_SRC='zoho';
function renderDailyReport(){
  const s=document.getElementById('s-daily'); if(!s) return;
  s.innerHTML='';
  const R=D.daily_report;
  if(!R||R.error){
    s.appendChild(el('div','nacard',esc((R&&R.error)||
      'The Daily Report needs the Zoho lead cache — run a sync.')));
    return;
  }
  const T=R[RPT_SRC]||R.zoho;
  s.appendChild(el('h2',null,'Daily Leads Report'));

  // stage-system toggle: the two systems disagree on half the leads, so the
  // report states which one it is reading instead of quietly picking a winner
  const tools=el('div','tools');
  tools.appendChild(el('span','cap','Stage system:'));
  [['zoho','Zoho / Inncircles'],['angad','ANGAD relay']].forEach(([k,lbl])=>{
    const bt=el('button',RPT_SRC===k?'on':null,esc(lbl));
    bt.onclick=()=>{ RPT_SRC=k; renderDailyReport(); };
    tools.appendChild(bt);
  });
  s.appendChild(tools);

  if(!T.rows||!T.rows.length){
    s.appendChild(el('div','nacard','No leads were born inside this window.'));
    return;
  }
  const nfmt=n=>Number(n||0).toLocaleString();
  const summary=[
    {label:'Leads born',value:nfmt(T.leads),sub:'person × project rows'},
    {label:'Days',value:nfmt(new Set(T.rows.map(r=>r[0])).size)},
    {label:'Projects',value:nfmt(T.projects)},
    {label:'Stage disagreements',value:nfmt(T.disagree),
     sub:'Zoho and ANGAD name different stages'},
  ];
  // KPIs first (contract: KPIs top-left), then the explanation beneath them
  s.appendChild(kpiRow(summary));
  s.appendChild(el('div','note',esc(T.note||'')));

  const wrap=el('div','tblwrap');
  const head='<tr>'+T.cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr>';
  const body=T.rows.map((r,ri)=>'<tr>'+r.map((v,i)=>
    `<td class="${i>=3?'num':''}${i>=3&&v?' cell':''}" data-r="${ri}" data-c="${i}">${num(v)}</td>`
  ).join('')+'</tr>').join('');
  const foot=T.totals?'<tr class="totrow">'+T.totals.map((v,i)=>
    `<td class="${i>=3?'num':''}">${num(v)}</td>`).join('')+'</tr>':'';
  wrap.innerHTML='<table><thead>'+head+'</thead><tbody>'+body+'</tbody><tfoot>'+foot+'</tfoot></table>';
  // every count cell resolves to its constituents (drill contract R3.1)
  wrap.querySelectorAll('td.cell').forEach(td=>{
    td.title='Open the leads behind this number';
    td.onclick=()=>{
      const r=T.rows[+td.dataset.r], ci=+td.dataset.c;
      const colName=T.cols[ci];
      openReportCell(r[0], r[2], colName, td.textContent.trim());
    };
  });
  s.appendChild(wrap);
  s.appendChild(el('div','cap',
    'Window '+esc(T.window)+' · reading '+esc(T.stage_label)+
    ' · ⚠ disagree = leads where the two stage systems name different stages.'));
}

async function openReportCell(day, project, colName, shown){
  const ov=document.getElementById('lmOverlay'); ov.classList.add('open');
  document.getElementById('lmTitle').textContent=
    colName+' — '+project+' — '+day;
  document.getElementById('lmSub').textContent='loading the leads behind this cell…';
  ['lmHead','lmTabs','lmBody'].forEach(x=>document.getElementById(x).innerHTML='');
  const q=currentQuery();
  q.date=day; q.project=project; q.sstage=RPT_SRC;
  q.stage=(colName==='Total'||colName==='⚠ disagree')?'':colName;
  let R;
  try{ R=await (await fetch('/api/report?'+new URLSearchParams(q))).json(); }
  catch(e){ document.getElementById('lmSub').textContent='server unreachable'; return; }
  const body=document.getElementById('lmBody');
  if(R.error){ document.getElementById('lmSub').textContent='';
    body.innerHTML='<div class="nacard">'+esc(R.error)+'</div>'; return; }
  const parity=String(R.count)===String(shown).replace(/[^0-9]/g,'');
  document.getElementById('lmSub').innerHTML=
    '<b>Total Count '+R.count.toLocaleString()+'</b> · cell shows <b>'+esc(shown)+
    '</b> — '+(parity
      ? '<span style="color:#0a8a0a">MATCH ✓</span>'
      : '<span style="color:#e34948">MISMATCH — please report via Feedback</span>')+
    ' · reading '+esc(R.cell.src);
  body.appendChild(el('div','note',esc(R.note)));
  body.appendChild(tableEl(R.tbl));
}

/* ============ LEADS BOARD (RAMA-7) ============
   One row per lead with the Inncircles Lead-Logs column set and their filter
   dimensions: Zoho stage, ANGAD stage, NEW vs FOLLOW-UP, contacted, last
   outcome, attempt band, WhatsApp reply. Loads on its own endpoint so the
   board's filters never disturb the global call-level filters. */
const LB={};                                  // current board filter state
let LB_LOADED=false;
function initLeadsBoard(){
  const s=document.getElementById('s-leadsboard');
  if(s.dataset.built) return; s.dataset.built='1';
  s.appendChild(el('h2',null,'Leads board'));
  s.appendChild(el('div','note','One row per lead (person × project) — the same grain '+
    'the Inncircles Lead Logs board uses. Filters here are the board’s own and are '+
    'independent of the global call filters above.'));
  s.appendChild(el('div','tools')).id='lbTools';
  s.appendChild(el('div')).id='lbSummary';
  s.appendChild(el('div')).id='lbOut';
  loadLeadsBoard();
}

const LB_FIELDS=[['lb_calltype','Call type'],['lb_contacted','Contacted'],
                 ['lb_stage','Stage (Zoho)'],['lb_prdstage','Stage (ANGAD)'],
                 ['lb_project','Project'],['lb_outcome','Last outcome'],
                 ['lb_attempts','Attempts'],['lb_source','Source'],
                 ['lb_wa','WA replied']];

async function loadLeadsBoard(){
  const out=document.getElementById('lbOut');
  if(!out) return;
  out.innerHTML='<div class="cap">loading the board…</div>';
  const q={t:TOKEN};
  Object.entries(LB).forEach(([k,v])=>{ if(v&&v.length) q[k]=v.join('|'); });
  const srch=document.getElementById('lbSearch');
  if(srch&&srch.value.trim()) q.lb_search=srch.value.trim();
  let R;
  try{ R=await (await fetch('/api/board?'+new URLSearchParams(q))).json(); }
  catch(e){ out.innerHTML='<div class="cap">could not reach the local server</div>'; return; }
  if(!R||R.error){ out.innerHTML='<div class="nacard">'+esc((R&&R.error)||'no data')+'</div>'; return; }

  // filter row (built once, from the board's own option lists)
  const tools=document.getElementById('lbTools');
  if(!tools.dataset.built){
    tools.dataset.built='1';
    const inp=el('input'); inp.id='lbSearch';
    inp.placeholder='Search MLID / Lead ID / Source Lead ID / project…';
    inp.style.minWidth='300px';
    inp.onkeydown=e=>{ if(e.key==='Enter') loadLeadsBoard(); };
    tools.appendChild(inp);
    LB_FIELDS.forEach(([key,label])=>{
      const vals=(R.options||{})[key]||[];
      if(!vals.length) return;
      const sel=document.createElement('select');
      sel.multiple=false; sel.title=label;
      sel.innerHTML='<option value="">'+esc(label)+': all</option>'+
        vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
      sel.onchange=()=>{ LB[key]=sel.value?[sel.value]:[]; loadLeadsBoard(); };
      tools.appendChild(sel);
    });
    const clr=el('button',null,'Clear board filters');
    clr.onclick=()=>{ Object.keys(LB).forEach(k=>delete LB[k]);
      tools.querySelectorAll('select').forEach(x=>x.value='');
      const i=document.getElementById('lbSearch'); if(i) i.value='';
      loadLeadsBoard(); };
    tools.appendChild(clr);
  }
  const sum=document.getElementById('lbSummary');
  sum.innerHTML=''; sum.appendChild(kpiRow(R.summary));
  out.innerHTML='';
  out.appendChild(el('div','note',esc(R.note)));
  out.appendChild(tableEl(R.tbl));
  out.appendChild(el('div','cap','Showing '+R.tbl.shown.toLocaleString()+' of '+
    R.total.toLocaleString()+' matching leads. Download CSV exports what is shown.'));
}

/* ============ PROGRESSIVE DISCLOSURE ============
   Measured load per tab: Positives 18 cards + 13 charts + 7 tables, Review 13
   cards + 8 charts, Intent 13 cards + 13 charts. Working memory holds ~4
   chunks, so a wall of 18 peers forces the reader to build the grouping
   themselves — that is extraneous load spent on layout instead of on the data.
   Rather than rewrite twenty builders, everything past the first few cards in a
   heavy section is folded behind one control. Nothing is removed and nothing is
   hidden silently: the control states exactly how many are folded, and one
   click restores the old view for anyone who wants the wall. */
const DISCLOSE_AFTER=6;
function discloseHeavySections(){
  document.querySelectorAll('section').forEach(sec=>{
    if(sec.dataset.disclosed) return;
    // Cards are usually nested inside .grid2/.grid3 wrappers, so counting only
    // direct children found zero and the fold never fired. Walk the direct
    // children but count the cards INSIDE each one, and cut at the child where
    // the running total passes the threshold — that keeps a grid row intact
    // instead of splitting it down the middle.
    const kids=[...sec.children];
    const total=sec.querySelectorAll('.card').length;
    if(total<=DISCLOSE_AFTER) return;
    let seen=0, cut=-1;
    for(let i=0;i<kids.length;i++){
      const n=kids[i].classList&&kids[i].classList.contains('card')
        ? 1 : kids[i].querySelectorAll?kids[i].querySelectorAll('.card').length:0;
      if(seen>=DISCLOSE_AFTER && n>0){ cut=i; break; }
      seen+=n;
    }
    if(cut<0) return;
    sec.dataset.disclosed='1';
    const rest=kids.slice(cut);
    const hidden=rest.reduce((a,n)=>a+((n.classList&&n.classList.contains('card'))?1:
      (n.querySelectorAll?n.querySelectorAll('.card').length:0)),0);
    if(!hidden) return;
    const box=el('div','folded');
    rest.forEach(n=>box.appendChild(n));
    const btn=el('button','discl','▾ Show '+hidden+' more cards in this section');
    let open=false;
    btn.onclick=()=>{ open=!open; box.classList.toggle('open',open);
      btn.textContent=(open?'▴ Hide ':'▾ Show ')+hidden+
        (open?' cards':' more cards in this section'); };
    sec.appendChild(btn); sec.appendChild(box);
  });
}

  out.innerHTML='';
  out.appendChild(el('div','note',esc(R.note)));
  R.items.forEach(it=>{
    const cd=el('div','card pend-'+esc(it.severity));
    const head=el('div','pendhead');

    head.appendChild(el('span','pendn',it.count==null?'—':Number(it.count).toLocaleString()));

    cd.appendChild(el('div','cap',esc(it.detail)));

      const b=el('button',null,'Open the rows →');
      b.onclick=()=>gotoTab(it.tab);
      cd.appendChild(b);
    }
    out.appendChild(cd);
  });
}

/* "Explain this number" (contract rule 5) */
function explain(label){
  // Every card answers. A hand-written contract wins; otherwise the contract
  // derived from the card's own sub-label and source is shown, clearly marked
  // PARTIAL. "NO DEFINITION EXPOSED" is now reserved for a label that does not
  // exist at all, which is a bug rather than a gap.
  const L=(D&&D.lineage&&D.lineage[label])||
          (D&&D.card_contracts&&D.card_contracts[label])||null;
  const ov=document.getElementById('lmOverlay'); ov.classList.add('open');
  document.getElementById('lmTitle').textContent='ⓘ '+label;
  const partial=L&&L.contract==='PARTIAL';
  document.getElementById('lmSub').textContent = !L
    ? 'no card with this label is currently on the page'
    : (partial ? 'PARTIAL contract — source known, constituents not yet verified'
               : 'FULL contract — verified definition behind this number');
  document.getElementById('lmHead').innerHTML='';
  document.getElementById('lmTabs').innerHTML='';
  const b=document.getElementById('lmBody');
  if(!L){ b.innerHTML='<div class="nacard">No card with this label is on the page right now.</div>'; return; }
  const cov=(D&&D.contract_coverage)||{};
  b.innerHTML=
    (partial?'<div class="note warn"><b>PARTIAL contract.</b> This card states a '+
      'value and a source, but its constituents have not been written down and '+
      'verified against a query. Treat the number as directional until they are.'+
      (cov.total?' Across the dashboard: <b>'+cov.full+'</b> of <b>'+cov.total+
      '</b> cards are fully contracted ('+cov.pct_full+'%).':'')+'</div>':'')+
    '<div class="card"><h3>Definition</h3>'+esc(L.def)+'</div>'+
    '<div class="grid2" style="margin-top:12px">'+
    '<div class="card"><h3>Numerator</h3>'+esc(L.num||'—')+'</div>'+
    '<div class="card"><h3>Denominator</h3>'+esc(L.den||'— (a count, not a rate)')+'</div>'+
    '<div class="card"><h3>Time window</h3>'+esc(L.window)+'</div>'+
    '<div class="card"><h3>Filter scope</h3>'+esc(L.filters)+'</div>'+
    '</div>'+
    '<div class="card" style="margin-top:12px"><h3>Source collection</h3>'+esc(L.src)+'</div>'+
    (L.excl?'<div class="note warn"><b>Excluded / contaminated:</b> '+esc(L.excl)+'</div>':'');
}

const FILTERS=[
  ['from','From','date'],['to','To','date'],
  ['born_from','Born from','date'],['born_to','Born to','date'],
  ['outcome_group','Outcome group','multi'],
  ['outcome','Outcome','multi'],
  ['status','Dial status','multi'],
  ['project','Project','multi'],
  ['stage','CRM stage','multi'],
  ['drop_stage','Drop stage','multi'],
  ['duration','Call length','multi'],
  ['attempts','Attempts on lead','multi'],
  ['audience','NRI / RI','multi'],
  ['hour','Hour of day','multi'],
  ['weekday','Weekday','multi'],
  ['direction','Direction','multi'],
  ['slug','Prompt','multi'],
  ['language','Language','multi'],
  ['era','Era','multi'],
  ['engine','Voice engine','multi'],
  ['source','Source','multi'],
  ['has_transcript','Transcript','multi'],
  ['quality','Transcript quality','multi'],
  ['qualified','Qualified','multi'],
  ['broker','Broker','multi'],
  ['whatsapp','WhatsApp','multi'],
  ['search','Search transcripts','text'],
];
const SEL={};

function multiselect(key,label,values){
  const wrap=el('div','f'); wrap.appendChild(el('label',null,esc(label)));
  const ms=el('div','ms');
  const btn=el('button','ms-btn'); btn.type='button';
  const pop=el('div','ms-pop');
  const search=el('input','ms-search'); search.placeholder='Search\u2026';
  const list=el('div','ms-list');
  if(!SEL[key]) SEL[key]=new Set();

  function paint(){
    const sel=SEL[key];
    btn.innerHTML='';
    const shown = sel.size ? [...sel].slice(0,2).map(esc).join(', ')+(sel.size>2?' +'+(sel.size-2):'') : 'All';
    btn.appendChild(el('span','v',shown));
    if(sel.size) btn.appendChild(el('span','cnt',String(sel.size)));
    btn.classList.toggle('active', sel.size>0);
  }
  function draw(q){
    q=(q||'').toLowerCase(); list.innerHTML='';
    const hits=values.filter(v=>!q||String(v).toLowerCase().includes(q));
    // Every option shows how many rows it would match IN THE CURRENT WINDOW.
    // Without this, picking a value that exists in the dataset but not in the
    // window (era=Kaalbhojaditya inside a July-August range) empties the screen
    // and reads as "the filter is broken". It never was — 22 of 22 filter
    // correctly; the modal was just offering values the window cannot show.
    // Gate semantics, stated where they apply (asked 2026-08-08):
    //   WITHIN one filter  = OR   (isin — tick BUSY and NO_ANSWER, get both)
    //   ACROSS filters     = AND  (each filter narrows what the last one left)
    if(!list.dataset.gated){
      list.dataset.gated='1';
    }
    const counts=(D&&D.option_counts&&D.option_counts[key])||null;
    hits.forEach(v=>{
      const row=el('label','ms-opt');
      const cb=el('input'); cb.type='checkbox'; cb.checked=SEL[key].has(v);
      cb.onchange=()=>{ cb.checked?SEL[key].add(v):SEL[key].delete(v); paint(); renderChips(); };
      row.appendChild(cb); row.appendChild(document.createTextNode(v));
      if(counts){
        const n=counts[String(v)]||0;
        const tag=el('span','optn',n?n.toLocaleString():'0 here');
        if(!n){ row.classList.add('dead');
          row.title='Nothing matches this inside the current date range — '+
                    'widen the dates or clear them to use it'; }
        row.appendChild(tag);
      }
      list.appendChild(row);
    });
    if(!hits.length) list.appendChild(el('div','cap','No matches'));
  }
  btn.onclick=e=>{
    e.stopPropagation(); e.preventDefault();
    const wasOpen=pop.classList.contains('open');
    document.querySelectorAll('.ms-pop.open').forEach(x=>x.classList.remove('open'));
    if(!wasOpen){ pop.classList.add('open'); draw(search.value); search.focus(); }
  };
  search.oninput=()=>draw(search.value);
  pop.onclick=e=>e.stopPropagation();

  const acts=el('div','ms-acts');
  const all=el('button',null,'Select all');
  all.onclick=e=>{e.stopPropagation();values.forEach(v=>SEL[key].add(v));draw(search.value);paint();renderChips();};
  const none=el('button',null,'Clear');
  none.onclick=e=>{e.stopPropagation();SEL[key].clear();draw(search.value);paint();renderChips();};
  acts.appendChild(all); acts.appendChild(none);

  pop.appendChild(search); pop.appendChild(list); pop.appendChild(acts);
  ms.appendChild(btn); ms.appendChild(pop); wrap.appendChild(ms);
  paint(); draw('');
  return wrap;
}

function renderChips(){
  const box=document.getElementById('chips'); if(!box) return;
  const bits=[];
  FILTERS.forEach(f=>{
    const key=f[0], label=f[1], type=f[2];
    if(type!=='multi') return;
    (SEL[key]||new Set()).forEach(v=>{
      bits.push('<span class="chip"><b>'+esc(label)+':</b>'+esc(v)+
                '<span data-k="'+esc(key)+'" data-v="'+esc(v)+'">\u00d7</span></span>');
    });
  });
  const txt=document.getElementById('f_search');
  if(txt&&txt.value) bits.push('<span class="chip"><b>Search:</b>'+esc(txt.value)+
                               '<span data-k="search" data-v="">\u00d7</span></span>');
  // Gate semantics, stated on the chip row itself. Verified against
  // apply_filters(): each filter narrows the frame the previous one left (AND),
  // and inside one filter the values are an isin() (OR).
  const GATE='<span class="cap" style="margin-left:auto">'+
    'ticks inside one filter = <b>OR</b> \u00b7 different filters combine with <b>AND</b></span>';
  box.innerHTML = bits.length ? (bits.join('')+GATE) :
    '<span class="cap">No filters applied \u2014 showing everything in the date range. '+
    'When you do filter: ticks inside one filter are <b>OR</b>, separate filters are <b>AND</b>.</span>';
  // mirror into the collapsed hero so active filters are ALWAYS visible
  const hero=document.getElementById('fhChips'), cnt=document.getElementById('fhCount');
  if(hero){
    hero.innerHTML = bits.length ? bits.join('') :
      '<span class="cap">No filters \u2014 showing everything in the date range. Click \u2699 Filters to narrow.</span>';
    hero.querySelectorAll('.chip span[data-k]').forEach(x=>{
      x.onclick=()=>{ const k=x.dataset.k, v=x.dataset.v;
        if(k==='search'){ const t=document.getElementById('f_search'); if(t)t.value=''; }
        else if(SEL[k]) SEL[k].delete(v);
        buildFilters(); renderChips(); load(); };
    });
  }
  if(cnt){ cnt.textContent=bits.length; cnt.style.display=bits.length?'':'none'; }
  box.querySelectorAll('.chip span[data-k]').forEach(x=>{
    x.onclick=()=>{
      const k=x.dataset.k;
      if(k==='search'){ const t=document.getElementById('f_search'); if(t) t.value='';
        localStorage.removeItem('f_searchval'); }
      else if(SEL[k]) SEL[k].delete(x.dataset.v);
      buildFilters(); load();
    };
  });
}

function buildFilters(){
  // B9 fix: prune selections whose key or value no longer exists in OPT
  const valid=new Set(FILTERS.filter(f=>f[2]==='multi').map(f=>f[0]));
  Object.keys(SEL).forEach(k=>{
    if(!valid.has(k)){ delete SEL[k]; return; }
    const allowed=new Set((OPT[k]||[]).map(String));
    [...SEL[k]].forEach(v=>{ if(!allowed.has(v)) SEL[k].delete(v); });
  });
  const box=document.getElementById('filters'); box.innerHTML='';
  const row=el('div','frow'); box.appendChild(row);

  FILTERS.forEach(f=>{
    const key=f[0], label=f[1], type=f[2];
    if(type==='multi'){
      const vals=(OPT[key]||[]).map(String);
      if(!vals.length) return;
      row.appendChild(multiselect(key,label,vals));
      return;
    }
    if(type==='date'){
      // date inputs live permanently in the toolbar — never hidden in a panel
      const d=document.getElementById('f_'+key);
      if(d && !d.dataset.wired){
        if(key==='from'||key==='to'){
          d.value = key==='from' ? (localStorage.getItem('f_from')||OPT.date_min)
                                 : (localStorage.getItem('f_to')||OPT.date_max);
          d.min=OPT.date_min; d.max=OPT.date_max;
        } else {
          // born-date range: blank means "no born filter", and lead birth can
          // predate the call window, so it is NOT clamped to the call range
          d.value = localStorage.getItem('f_'+key)||'';
        }
        d.onchange=()=>{ if(key==='from'||key==='to') markPreset(null);
          localStorage.setItem('f_'+key, d.value); load(); };
        d.dataset.wired='1';
      }
      return;
    }
    const cell=el('div','f'); cell.appendChild(el('label',null,esc(label)));
    const input=el('input'); input.id='f_'+key;
    {
      input.type='text'; input.placeholder='word or LEAD-ref';
      input.value = localStorage.getItem('f_searchval')||'';
      input.onkeydown=e=>{ if(e.key==='Enter'){ localStorage.setItem('f_searchval',input.value); renderChips(); load(); } };
    }
    cell.appendChild(input); row.appendChild(cell);
  });

  const chips=el('div','chips'); chips.id='chips'; box.appendChild(chips);

  const bar=el('div','fbar');
  const apply=el('button','primary','Apply filters');
  apply.onclick=()=>{ document.getElementById('filterModal').classList.remove('open');
    renderChips(); load(); };
  const reset=el('button',null,'Clear filters');
  reset.onclick=()=>{ Object.keys(SEL).forEach(k=>SEL[k].clear());
    localStorage.removeItem('f_searchval');
    buildFilters(); renderChips(); load(); };
  bar.appendChild(apply); bar.appendChild(reset);
  bar.appendChild(el('span','cap','Tick any number of values in each dropdown \u2014 filters combine.'));
  box.appendChild(bar);
  renderChips();
}

function markPreset(name){
  document.querySelectorAll('#dpresets .dpreset').forEach(b=>
    b.classList.toggle('on', b.textContent===name));
}
function buildPresets(){
  const host=document.getElementById('dpresets');
  if(!host || host.dataset.built) return;
  host.dataset.built='1';
  const maxD=OPT.date_max, minD=OPT.date_min;
  const back=n=>{ const d=new Date(maxD); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
  const monthStart=()=>{ const d=new Date(maxD); d.setDate(1); return d.toISOString().slice(0,10); };
  const set=(from,to,label)=>{
    document.getElementById('f_from').value=from;
    document.getElementById('f_to').value=to;
    markPreset(label); load();
  };
  [['Today',()=>set(maxD,maxD,'Today')],
   ['Yesterday',()=>set(back(1),back(1),'Yesterday')],
   ['Last 7 days',()=>set(back(6),maxD,'Last 7 days')],
   ['Last 30 days',()=>set(back(29),maxD,'Last 30 days')],
   ['This month',()=>set(monthStart(),maxD,'This month')],
   ['ANGAD era',()=>set('2026-07-17',maxD,'ANGAD era')],
   ['All time',()=>set(minD,maxD,'All time')],
  ].forEach(([label,fn])=>{
    const b=el('button','dpreset',label); b.onclick=fn; host.appendChild(b);
  });
}

function currentQuery(){
  const q={t:TOKEN};
  FILTERS.forEach(f=>{
    const key=f[0], type=f[2];
    if(type==='multi'){
      const v=[...(SEL[key]||[])];
      if(v.length) q[key]=v.join('|');
    } else {
      const e=document.getElementById('f_'+key);
      if(e&&e.value) q[key]=e.value;
    }
  });
  if(q.from) localStorage.setItem('f_from',q.from);
  if(q.to) localStorage.setItem('f_to',q.to);
  const pt=document.getElementById('piiToggle');
  if(pt&&pt.checked) q.pii='1';
  const us=document.getElementById('unitSel');
  if(us&&us.value!=='calls') q.unit=us.value;
  return q;
}

/* left sidebar: [id, label, icon] — '#' rows are group headings */
/* NAV — grouped into four chunks (2026-08-08 cognitive-load pass).
   It was 22 flat items under one heading. Working memory holds ~4 chunks
   (Cowan), and Hick's law makes choice time grow with log2(n): 22 flat options
   is ~4.5 bits of decision every time you look at the sidebar, and because
   every item is rendered identically there is no pop-out — finding one is a
   serial scan of all 22. Four labelled groups of 4-7 turn one long scan into
   "which group?" then "which of five?" — about 2.3 + 2.3 bits, and the group
   headings become learnable landmarks so the second visit is near-instant.
   NOTHING WAS REMOVED. Every section is still one click away. */

function gotoTab(id){
  id=TAB_ALIAS[id]||id;
  const b=document.querySelector('#nav button[data-tab="'+id+'"]');
  if(b) b.click();
}

function buildNav(){
  const nav=document.getElementById('nav');
  if(nav.children.length) return;
  TABS.forEach(([id,label,icon],i)=>{
    if(id==='#'){ nav.appendChild(el('div','navgroup',esc(label))); return; }
    const b=el('button',i?'':'on',
      '<i>'+esc(icon)+'</i><span class="lbl">'+esc(label)+'</span>');
    b.title=label; b.dataset.tab=id;
    b.onclick=()=>{
      nav.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      document.querySelectorAll('section').forEach(s=>s.classList.remove('on'));
      document.getElementById('s-'+id).classList.add('on');
      document.getElementById('pageTitle').textContent=label;
      localStorage.setItem('tab',id);
      window.scrollTo({top:0,behavior:'smooth'});
    };
    nav.appendChild(b);
  });
  // The first TABS entry is now a group HEADING, not a button. Falling back to
  // children[0] would click a <div> and leave every section hidden, so resolve
  // to the first real button instead.
  const saved=TAB_ALIAS[localStorage.getItem('tab')]||localStorage.getItem('tab')||'today';
  const target=nav.querySelector('button[data-tab="'+saved+'"]')||nav.querySelector('button');
  if(target) target.click();
}

    }
  }

  // ---- CIF (Conversation Indicator Framework v1.1)
  s=document.getElementById('s-cif'); s.innerHTML='';
  if(D.cif){
    const C=D.cif;
    s.appendChild(el('h2',null,'CIF — Conversation Indicator Framework v2'));

      s.appendChild(el('div','cap','Substantive calls only. Personas the agent named itself in-call: '+
        (names||'none detected')+'. "undated" = the corpus row carries no call date — '+
        'call_date is null on 3,853 of 3,862 re-transcript rows, which is a gap in the '+
        'import, not a property of the calls.'));
    }
    // sub-tabs: one per CIF parameter + the two working views
    const sub=el('div','cifsub'), pane=el('div');
    const views=[['Overview',()=>{const d=el('div');
        d.appendChild(card('Exchange Balance Ratio distribution (lead share of words)',
          hbar(C.ebr_hist),
          'CIF target band is 40–60%. The mass below 40% is the bot monologuing — '+
          'the clearest single finding in the framework right now.'));
        const grid_=el('div','ipanel');
        C.params.forEach(p=>{
          const k=el('div','istat');
          k.appendChild(el('div','l',esc(p.param)));
          k.appendChild(el('div','n',p.computed+'/'+p.total));
          k.appendChild(el('div','cap','computed · core metric '+esc(p.core)));
          k.onclick=()=>{ sub.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
            [...sub.querySelectorAll('button')].find(x=>x.textContent===p.param).click(); };
          grid_.appendChild(k);
        });
        d.appendChild(el('h2',null,'The six parameters — click one to open its indicators'));
        d.appendChild(grid_);
        return d;}],
      ...C.params.map(p=>[p.param,()=>{
        const d=el('div');
        d.appendChild(el('div','note','Core metric: <b>'+esc(p.core)+'</b> · '+
          p.computed+' of '+p.total+' indicators computed from the clean corpus'));
        const t=el('div','tblwrap');
        t.innerHTML='<table><thead><tr><th>Code</th><th>Indicator</th>'+
          '<th>Target</th><th>Current (median)</th><th>Calls</th><th>Definition (original CIF v1.1)</th>'+
          '</tr></thead><tbody>'+
          p.indicators.map(i=>'<tr'+(i.judge?' style="opacity:.6"':'')+'>'+
            '<td><b>'+esc(i.code)+'</b></td><td>'+esc(i.label)+
            (i.scoped_to_substantive?' <span class="cap" title="Computed only on calls where the customer actually spoke">◍</span>':'')+
            '</td>'+
            '<td>'+esc(i.target)+'</td>'+
            '<td class="num"><b>'+esc(i.value)+'</b></td>'+
            '<td class="num">'+(i.n||'—')+'</td>'+
            '<td style="white-space:normal;max-width:520px;font-size:11.5px;line-height:1.45">'+
            esc(i.definition)+
            (i.na_reason?'<div style="margin-top:5px;color:var(--warn)"><b>NA because:</b> '+
              esc(i.na_reason)+'</div>':'')+
            '</td></tr>').join('')+'</tbody></table>';
        d.appendChild(t);
        d.appendChild(el('div','cap','Every NA now states WHICH problem it is — a judge backlog, '+
          'an empty upstream column, or too few substantive calls. ◍ marks an indicator computed '+
          'only on calls where the customer actually spoke. Definitions are verbatim from the CIF '+
          'scoring dashboard (human-agent variant, 30 indicators / 5 parameters).'));
        return d;}]),
      ['Per-call scores',()=>{const d=el('div');
        d.appendChild(tableEl(C.table));
        d.appendChild(el('div','cap','Click any MLID to open the lead, then its Conversation tab for the turn-by-turn view.'));
        return d;}],
    ];
    views.forEach(([name,fn],i)=>{
      const b=el('button',i?'':'on',esc(name));
      b.onclick=()=>{ sub.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
        b.classList.add('on'); pane.innerHTML=''; pane.appendChild(fn()); };
      sub.appendChild(b);
    });
    s.appendChild(sub); s.appendChild(pane); pane.appendChild(views[0][1]());
  } else {
    s.appendChild(el('div','nacard','No CIF scores yet — run `python cif.py` after importing clean transcriptions.'));
  }

  // ---- GEOGRAPHY (was a decorative globe; now the numbers it hid)
  renderGeography();

  // ---- scope chips (Responsive Scopes: simple defaults, one click)
  renderScopes();

  // ---- LAST: fold the tail of the heaviest sections. This must run AFTER
  // every section has been built — called earlier it found nothing to fold,
  // because Positives/Intent/Review had not been rendered yet.
  discloseHeavySections();
}

/* ---------------- scope chips ---------------- */
window.CMP_ON=localStorage.getItem('cmp')==='1';
function renderScopes(){
  const sc=document.getElementById('scopes'); if(sc.dataset.built) return;
  sc.dataset.built='1';
  const set=(from,to,label)=>{
    document.getElementById('f_from').value=from||OPT.date_min;
    document.getElementById('f_to').value=to||OPT.date_max;
    sc.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.textContent===label));
    load();
  };
  const mk=(label,fn)=>{const b=el('button',null,label);b.onclick=fn;sc.appendChild(b);return b;};
  // date presets now live in the toolbar; this row keeps the analysis toggles
  // contract rule 8: comparison is a toggle, not a screen
  const cmp=mk('Compare to previous period',()=>{
    window.CMP_ON=!window.CMP_ON; localStorage.setItem('cmp',window.CMP_ON?'1':'0');
    cmp.classList.toggle('on',window.CMP_ON); render();
  });
  cmp.classList.toggle('on',window.CMP_ON);
  cmp.title='Adds a delta vs the previous equal-length period to the headline KPIs (date-window comparison)';
  // contract rule 9: saved investigations — name a filter state, pin, reopen
  const sv=mk('Save this view',()=>{
    const name=prompt('Name this investigation (filters + dates are saved):'); if(!name)return;
    const all=JSON.parse(localStorage.getItem('savedViews')||'{}');
    all[name]=location.hash; localStorage.setItem('savedViews',JSON.stringify(all)); paintSaved();
  });
  sv.title='Pins the current filter+date state under a name';
  const bar=el('span','savebar'); bar.id='savedBar'; sc.appendChild(bar);
  window.paintSaved=function(){
    bar.innerHTML='';
    const all=JSON.parse(localStorage.getItem('savedViews')||'{}');
    Object.entries(all).forEach(([n,h])=>{
      const b=el('button',null,esc(n));
      b.onclick=()=>{ location.hash=h; applyHashState(); load(); };
      b.oncontextmenu=e=>{ e.preventDefault();
        if(confirm('Delete saved view "'+n+'"?')){ delete all[n];
          localStorage.setItem('savedViews',JSON.stringify(all)); paintSaved(); } };
      b.title='Click to open · right-click to delete';
      bar.appendChild(b);
    });
  };
  paintSaved();
}

/* contract rules 4+7: any view reachable by URL alone */
function syncHash(q){
  const h=new URLSearchParams(); Object.entries(q).forEach(([k,v])=>{ if(k!=='t'&&v)h.set(k,v); });
  history.replaceState(null,'','#'+h.toString());
}
function applyHashState(){
  const h=new URLSearchParams(location.hash.slice(1));
  for(const [k,v] of h){
    if(k==='from') localStorage.setItem('f_from',v);
    else if(k==='to') localStorage.setItem('f_to',v);
    else if(k==='unit') localStorage.setItem('unit',v);
    else { SEL[k]=new Set(v.split('|')); }
  }
  const ff=document.getElementById('f_from'), ft=document.getElementById('f_to');
  if(ff&&h.get('from')) ff.value=h.get('from');
  if(ft&&h.get('to')) ft.value=h.get('to');
  if(typeof buildFilters==='function'&&OPT) buildFilters();
}

/* contract rule 10: command palette (Ctrl+K) */
(function(){
  const pal=()=>document.getElementById('palette');
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault();
      pal().classList.add('open'); const i=document.getElementById('palInput');
      i.value=''; i.focus(); drawPal(''); }
    if(e.key==='Escape'){ pal().classList.remove('open');
      document.getElementById('lmOverlay').classList.remove('open'); }
  });
  window.drawPal=function(q){
    const list=document.getElementById('palList'); list.innerHTML=''; q=(q||'').trim();
    const rows=[];
    if(/^(\d{3,7}|[A-Za-z0-9]+-[A-Za-z]+|LEAD-[0-9a-f]+)$/i.test(q))
      rows.push({t:'👤 Open lead '+q, fn:()=>openLeadModal(q)});
    TABS.filter(t=>!q||t[1].toLowerCase().includes(q.toLowerCase()))
        .forEach(t=>rows.push({t:'⬚ '+t[1]+' tab', fn:()=>gotoTab(t[0])}));
    [['today','Today'],['7d','Last 7 days'],['era','ANGAD era'],['all','Everything']]
      .filter(x=>!q||x[0].startsWith(q.toLowerCase()))
      .forEach(x=>rows.push({t:'📅 Scope: '+x[1],
        fn:()=>{ document.querySelectorAll('#scopes button').forEach(b=>{ if(b.textContent===x[1]) b.click(); }); }}));
    rows.slice(0,12).forEach((r,i)=>{
      const d=el('div','palRow'+(i===0?' on':''),esc(r.t));
      d.onclick=()=>{ pal().classList.remove('open'); r.fn(); };
      list.appendChild(d);
    });
  };
  document.addEventListener('DOMContentLoaded',()=>{
    const i=document.getElementById('palInput');
    if(!i) return;
    i.oninput=()=>drawPal(i.value);
    i.onkeydown=e=>{ if(e.key==='Enter'){ const first=document.querySelector('#palList .palRow');
      if(first) first.click(); } };
  });
})();

    ['Lead History',()=>P.events?wrapT(P.events,P.events_src+' — every transaction, newest first'):na('No lead_events for this lead (pre-Intelligent_CRM lead).')],
    ['Stage History',()=>{const d=el('div');

  });
