/* ---------------- globe ---------------- */
let GLOBE={rot:78,zoom:1,mode:'world'};
function renderGlobe(){
  const s=document.getElementById('s-globe'); s.innerHTML='';
  const G=D.globe; if(!G){ s.appendChild(el('div','cap','No globe data.')); return; }
  s.appendChild(el('h2',null,'Where the calls go — drag to spin · scroll to zoom · hover for numbers'));
  s.appendChild(el('div','note','<b>'+G.ri_calls.toLocaleString()+'</b> RI humans (India · Plivo) · <b>'+
    G.nri_calls.toLocaleString()+'</b> NRI humans (Telnyx). Arcs = Hyderabad → NRI countries from the '+
    'workbook country data. '+esc(G.src)));
  const btns=el('div','gbtns');
  ['world','hyderabad'].forEach(m=>{
    const b=el('button',null,m==='world'?'🌍 World':'📍 Hyderabad sites');
    b.onclick=()=>{GLOBE.mode=m;draw();};
    btns.appendChild(b);
  });
  s.appendChild(btns);
  const cv=document.createElement('canvas'); cv.id='globeC'; cv.width=940; cv.height=560;
  s.appendChild(cv);
  const info=el('div','cap',''); s.appendChild(info);
  (G.na||[]).forEach(x=>s.appendChild(el('div','nacard','NA · '+esc(x))));
  if(G.urls&&G.urls.length){
    s.appendChild(el('h2',null,'Major URLs bringing these leads'));
    s.appendChild(card(null,hbar(G.urls),'source: Zoho_Database.leads.first_page_visited'));
  }
  const ctx=cv.getContext('2d');
  const R=()=>210*GLOBE.zoom, CX=470, CY=280;
  function proj(lon,lat){
    const l=(lon-GLOBE.rot)*Math.PI/180, p=lat*Math.PI/180;
    const x=Math.cos(p)*Math.sin(l), y=Math.sin(p), z=Math.cos(p)*Math.cos(l);
    return z<-0.15?null:[CX+R()*x, CY-R()*y, z];
  }
  let pts=[];
  function draw(){
    ctx.clearRect(0,0,940,560); pts=[];
    if(GLOBE.mode==='hyderabad'){
      ctx.font='13px sans-serif';
      (G.sites||[]).forEach((st,i)=>{
        const x=200+(st.lon-78.3)*4000, y=420-(st.lat-17.38)*4000;
        ctx.fillStyle='#ffb54d'; ctx.beginPath(); ctx.arc(x,y,9,0,7); ctx.fill();
        ctx.fillStyle='#dfe6f2'; ctx.fillText(st.name+' · '+st.area,x+14,y+4);
        pts.push({x,y,tip:st.name+' — '+st.area});
      });
      ctx.fillStyle='#8a93a8'; ctx.fillText('Project sites (approx). City-level lead geography: NA in the data.',30,530);
      return;
    }
    ctx.strokeStyle='rgba(120,150,200,.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(CX,CY,R(),0,7); ctx.stroke();
    for(let lat=-60;lat<=60;lat+=30){
      ctx.beginPath(); let pen=false;
      for(let lon=-180;lon<=180;lon+=5){
        const p=proj(lon,lat); if(!p){pen=false;continue;}
        pen?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); pen=true;
      } ctx.stroke();
    }
    for(let lon=-180;lon<180;lon+=30){
      ctx.beginPath(); let pen=false;
      for(let lat=-85;lat<=85;lat+=5){
        const p=proj(lon,lat); if(!p){pen=false;continue;}
        pen?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); pen=true;
      } ctx.stroke();
    }
    const hyd=proj(G.hyd.lon,G.hyd.lat);
    if(hyd){
      ctx.fillStyle='#ffb54d'; ctx.beginPath(); ctx.arc(hyd[0],hyd[1],7,0,7); ctx.fill();
      ctx.fillStyle='#ffd9a0'; ctx.font='12.5px sans-serif';
      ctx.fillText('Hyderabad · '+G.ri_calls.toLocaleString()+' RI humans',hyd[0]+11,hyd[1]-6);
      pts.push({x:hyd[0],y:hyd[1],tip:'Hyderabad — origin · '+G.ri_calls.toLocaleString()+' RI humans (Plivo)'});
    }
    (G.arcs||[]).forEach(a=>{
      const p2=proj(a.lon,a.lat); if(!p2) return;
      if(hyd){
        ctx.strokeStyle='rgba(138,92,214,.75)'; ctx.lineWidth=Math.min(4,1+Math.log10(1+a.calls));
        const mx=(hyd[0]+p2[0])/2, my=(hyd[1]+p2[1])/2-60*GLOBE.zoom;
        ctx.beginPath(); ctx.moveTo(hyd[0],hyd[1]); ctx.quadraticCurveTo(mx,my,p2[0],p2[1]); ctx.stroke();
      }
      ctx.fillStyle='#9f7be8'; ctx.beginPath(); ctx.arc(p2[0],p2[1],4+Math.min(6,Math.log10(1+a.calls)*2),0,7); ctx.fill();
      ctx.fillStyle='#cdd6e8'; ctx.font='11.5px sans-serif'; ctx.fillText(a.to,p2[0]+8,p2[1]+3);
      pts.push({x:p2[0],y:p2[1],tip:a.to+' — '+a.calls.toLocaleString()+' leads (workbook country)'});
    });
  }
  cv.onmousemove=e=>{
    const r=cv.getBoundingClientRect(), sx=cv.width/r.width;
    const mx=(e.clientX-r.left)*sx, my=(e.clientY-r.top)*sx;
    if(e.buttons===1){ GLOBE.rot+=e.movementX*0.4; draw(); return; }
    const hit=pts.find(p=>Math.hypot(p.x-mx,p.y-my)<12);
    info.textContent=hit?hit.tip:'';
    cv.style.cursor=hit?'pointer':'grab';
  };
  cv.onwheel=e=>{ e.preventDefault();
    GLOBE.zoom=Math.max(.6,Math.min(2.4,GLOBE.zoom*(e.deltaY<0?1.1:0.9))); draw(); };
  draw();
}

    `<div class="kpi"><div class="l">${esc(k.label)}</div><div class="v">${esc(k.value)}</div>

  sec('Site visits (Intelligent_CRM)', P.visits_crm, P.visits_crm_src);
  sec('Stage timeline — lead events', P.events, P.events_src);
}

/* ---------------- io ---------------- */
async function load(){
  const q=currentQuery();
  syncHash(q);                       // contract rule 4: every view has a URL
  const sub=document.getElementById('sub');
  sub.textContent='loading\u2026';
  const mySeq=++loadSeq;              // B1 fix: only the newest request may render
  let j;
  try{
    j=await (await fetch('/api/data?'+new URLSearchParams(q))).json();
  }catch(err){
    if(mySeq===loadSeq)
      sub.textContent='could not reach the local server \u2014 is dashboard.py still running?';
    return;
  }
  if(mySeq!==loadSeq) return;         // a newer request superseded this one
  if(j.error){ sub.textContent='error: '+j.error; return; }
  if(j.empty){
    sub.innerHTML='No local cache. Click <b>Fetch fresh data from Mongo</b>, '+
      'or run <code>python sync.py --full</code>.';
    return;
  }
  if(j.options) OPT=j.options;
  if(j.pii) applyPiiState(j.pii);

  if(j.no_rows){
    const bits=Object.entries(j.applied||{}).map(([k,v])=>
      '<b>'+esc(k)+'</b> = '+esc(String(v).split('|').join(', ')));
    sub.textContent='0 of '+(j.total_calls||0).toLocaleString()+' calls match the current filters.';
    document.getElementById('kpis').innerHTML='';
    document.querySelectorAll('section').forEach(x=>x.innerHTML='');
    // the Leads tab builds itself once and is guarded by dataset.built —
    // clearing its HTML without clearing the guard left it blank forever
    document.getElementById('s-profile').removeAttribute('data-built');
    const box=document.getElementById('s-'+(localStorage.getItem('tab')||'numbers'))
              ||document.getElementById('s-numbers');
    const card=el('div','card');
    card.appendChild(el('h3',null,'Nothing matches these filters'));
    card.appendChild(el('div','cap','The cache holds '+(j.total_calls||0).toLocaleString()+
      ' calls. Your current selection excludes all of them:'));
    card.appendChild(el('div','cap','<br>'+(bits.length?bits.join('<br>'):'date range '+
      esc(j.meta.from)+' \u2192 '+esc(j.meta.to))));
    const b=el('button','primary','Reset all filters');
    b.style.marginTop='12px';
    b.onclick=()=>{ Object.keys(SEL).forEach(k=>SEL[k].clear());
      localStorage.removeItem('f_from'); localStorage.removeItem('f_to');
      localStorage.removeItem('f_searchval'); buildFilters(); load(); };
    card.appendChild(b);
    box.classList.add('on'); box.appendChild(card);
    return;
  }
  D=j; render();
}

function applyPiiState(p){
  const wrap=document.getElementById('piiWrap');
  const badge=document.getElementById('piiBadge');
  if(!wrap) return;
  wrap.style.display = p.available ? '' : 'none';
  const t=document.getElementById('piiToggle');
  if(t&&!t._wired){
    t._wired=true;
    t.checked = localStorage.getItem('pii')==='1';
    t.onchange=()=>{ localStorage.setItem('pii', t.checked?'1':'0'); load(); };
  }
  const on = t && t.checked;
  badge.textContent = on ? 'local only \u00b7 127.0.0.1 \u00b7 SHOWING PHONE NUMBERS'
                         : 'local only \u00b7 127.0.0.1 \u00b7 no PII';
  badge.style.borderColor = on ? '#eb6834' : '';
  badge.style.color = on ? '#eb6834' : '';
}

document.getElementById('refresh').onclick=async()=>{
  if(!confirm('Pull fresh data from MongoDB now?\n\nThis re-reads all four databases '+
              '(read-only) and can take 10-20 minutes. The dashboard keeps working '+
              'on the current cache until it finishes.')) return;
  document.getElementById('busy').style.display='flex';
  document.getElementById('busyTitle').textContent='Fetching from MongoDB…';
  await fetch('/api/refresh?full=1&t='+TOKEN); // incremental sync has the stale-watermark bug: it pulls nothing
  let pollFails=0;
  const poll=setInterval(async()=>{
    let s;
    try{ s=await (await fetch('/api/status?t='+TOKEN)).json(); }
    catch(e){                              // B4 fix: server unreachable
      if(++pollFails>=4){ clearInterval(poll);
        document.getElementById('busyTitle').textContent=
          'Lost contact with the local server \u2014 restart dashboard.py';
      }
      return;
    }
    pollFails=0;
    document.getElementById('busyLog').textContent=s.log||'working…';
    if(!s.running){
      clearInterval(poll);
      document.getElementById('busyTitle').textContent='Done — reloading';
      setTimeout(async()=>{
        document.getElementById('busy').style.display='none';
        try{                              // B7 fix: options may have changed
          const oj=await (await fetch('/api/options?t='+TOKEN)).json();
          if(oj.options){ OPT=oj.options; buildFilters(); }
        }catch(e){}
        load();
      },900);
    }
  },2500);
};

(async()=>{
  // Fetch options first and build the filter controls, THEN load data using
  // those controls. Loading data before the controls exist made the first
  // paint ignore the saved date range - the page showed one range while the
  // date boxes showed another.
  let j;
  try{
    j=await (await fetch('/api/options?t='+TOKEN)).json();
  }catch(err){
    document.getElementById('sub').textContent=
      'could not reach the local server on this port.';
    return;
  }
  if(j.empty){
    document.getElementById('sub').innerHTML=
      'No local cache yet. Click <b>Fetch fresh data from Mongo</b> above, '+
      'or run <code>python sync.py --full</code> in the terminal.';
    return;
  }
  OPT=j.options;
  if(j.pii) applyPiiState(j.pii);
  const us=document.getElementById('unitSel');
  us.value=localStorage.getItem('unit')||'calls';
  us.onchange=()=>{localStorage.setItem('unit',us.value); load();};
  buildFilters();
  buildPresets();
  // filters open in a modal (Inncircles pattern); dates stay on the toolbar
  const fModal=document.getElementById('filterModal');
  document.getElementById('fhToggle').onclick=()=>fModal.classList.add('open');
  fModal.onclick=e=>{ if(e.target===fModal) fModal.classList.remove('open'); };
  document.getElementById('fhReset').onclick=()=>{
    Object.keys(SEL).forEach(k=>SEL[k]&&SEL[k].clear());
    const t=document.getElementById('f_search'); if(t)t.value='';
    localStorage.removeItem('f_searchval');
    ['born_from','born_to'].forEach(k=>{ const e=document.getElementById('f_'+k);
      if(e){ e.value=''; localStorage.removeItem('f_'+k); } });
    buildFilters(); renderChips(); load();
  };
  // sidebar collapse
  const app=document.getElementById('app'), st=document.getElementById('sideToggle');
  if(localStorage.getItem('sideCollapsed')==='1') app.classList.add('collapsed');
  st.onclick=()=>{ app.classList.toggle('collapsed');
    localStorage.setItem('sideCollapsed', app.classList.contains('collapsed')?'1':'0');
    st.textContent = app.classList.contains('collapsed') ? '⟩' : '⟨ Collapse'; };
  if(app.classList.contains('collapsed')) st.textContent='⟩';
  // top-bar id search → opens the lead directly
  const aud=document.getElementById('audSel');
  aud.value=localStorage.getItem('aud')||'';
  aud.onchange=()=>{ localStorage.setItem('aud',aud.value);
    SEL['audience']=aud.value?new Set([aud.value]):new Set();
    buildFilters(); renderChips(); load(); };
  if(aud.value) SEL['audience']=new Set([aud.value]);
  const ids=document.getElementById('idSearch');
  ids.onkeydown=e=>{ if(e.key==='Enter'&&ids.value.trim()) openLeadModal(ids.value.trim()); };
  renderChips();
  if(location.hash.length>1) applyHashState();   // URL state wins (rule 4)
  load();
})();
